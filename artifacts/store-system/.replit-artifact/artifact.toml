kind = "web"
previewPath = "/"
title = "Store Management System"
version = "1.0.0"
id = "artifacts/store-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24820

[services.development]
run = "pnpm --filter @workspace/store-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/store-system", "run", "build" ]
publicDir = "artifacts/store-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24820"
BASE_PATH = "/"
